name: GDExtension Build

on:
  workflow_call:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    env:
      # Cache C/C++ compilation with sccache, backed by the GitHub Actions cache.
      SCCACHE_GHA_ENABLED: "true"
      USE_SCCACHE: "1"

    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-2022"]

    steps:
      - name: Checkout source
        #v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up pixi (pinned Python 3.14 + scons + jinja2)
        #v0.10.0
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f
        with:
          pixi-version: v0.72.2
          cache: true

      - name: Set up sccache (GitHub Actions cache backend)
        #v0.0.10
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

      - name: Restore openUSD cache
        #v5.0.4
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            thirdparty/openusd-26.05*
          key: ${{ matrix.os }}-openusd-v26.05-2

      - name: Build GDExtension
        working-directory: .
        # Same one command as local dev: builds debug & release targets under
        # the pinned pixi toolchain (see the `gdextension` task in pixi.toml).
        run: pixi run gdextension
        shell: bash

      - name: Save openUSD to cache
        #v5.0.4
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            thirdparty/openusd-26.05*
          key: ${{ matrix.os }}-openusd-v26.05-2

      - name: Prepare artifacts
        working-directory: .
        run: |
          mkdir -p artifacts/gdextension
          mkdir -p artifacts/sdk
          cp -r addons/IDTXFlow artifacts/gdextension/
          cp -r build/idtxflow-sdk artifacts/sdk/
        shell: bash

      - name: Zip binaries and SDK (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        shell: bash
        run: |
          zip -r gdextension-${{ runner.os }}.zip artifacts/gdextension
          zip -r idtxflow-sdk-${{ runner.os }}.zip artifacts/sdk

      - name: Zip binaries and SDK (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\gdextension\* -DestinationPath gdextension-${{ runner.os }}.zip
          Compress-Archive -Path artifacts\sdk\* -DestinationPath idtxflow-sdk-${{ runner.os }}.zip

      - name: Upload artifact
        #v7.0.0
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: gdextension-${{ runner.os }}
          path: |
            ./gdextension-${{ runner.os }}.zip
            ./idtxflow-sdk-${{ runner.os }}.zip
